<html lang="lt">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#111111">
<title>Raportai</title>
<style>
:root{color-scheme:dark;--bg:#111;--card:#1b1b1b;--line:#2e2e2e;--tx:#eee;--mu:#999;--ac:#c8d94a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:20px;letter-spacing:.15em;margin:0}
h2{font-size:18px;margin:0 0 4px}
p.s{color:var(--mu);margin:0 0 16px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:12px 16px}
button.p{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
button.g{padding:6px 12px;font-size:13px;color:var(--mu)}
.card{display:block;width:100%;text-align:left;margin-bottom:10px;padding:16px}
.card b{display:block;letter-spacing:.05em}
.card span{color:var(--mu);font-size:14px}
label{display:block;margin:14px 0 4px;font-size:13px;color:var(--mu)}
label i{color:var(--ac);font-style:normal;font-weight:700;margin-right:6px}
input,select,textarea{width:100%;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:11px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
.act{display:flex;gap:8px;flex-wrap:wrap}
.act button{flex:1}
.hide{display:none}
.bar{height:6px;background:var(--line);border-radius:4px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tx)}
.wh{color:var(--mu);font-size:13px;letter-spacing:.05em;margin-bottom:6px}
.cr{display:flex;align-items:center;gap:8px;margin:10px 0}
.cr span{flex:1;font-weight:600}
.cr button{width:52px;padding:10px 0;font-size:20px}
.cr output{display:inline-block;width:46px;text-align:center;font-weight:700;font-size:20px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg button{padding:16px 10px;font-weight:600}
.tg button.on{background:var(--tx);color:#111}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.ch{display:inline-block;margin:0 6px 6px 0}
.ch input{display:none}
.ch span{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);font-size:14px;cursor:pointer}
.ch input:checked+span{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
</style>
</head>

<main>
<header><h1>RAPORTAI</h1><button class="g" id="clr">Išvalyti</button></header>
<section id="v0"><h2>Pasirinkite raportą</h2><p class="s">Parinkite raportą, kurį norite parengti.</p><div id="list"></div></section>
<section id="v1" class="hide"><h2 id="t1"></h2><p class="s" id="d1"></p><div id="form"></div>
<div class="nav"><button id="b1">← Atgal</button><button class="p" id="n1">Toliau →</button></div></section>
<section id="v2" class="hide"><h2>Patikrinkite raportą</h2><p class="s">Jei viskas teisinga, nukopijuokite arba dalinkitės tekstu.</p><pre id="out"></pre>
<div class="act"><button class="p" id="cp">KOPIJUOTI RAPORTĄ</button><button id="sh">DALINTIS →</button></div>
<div class="nav"><button id="b2">← Atgal</button></div></section>
</main>
